services:
  backend:
    build:
      context: .
      dockerfile: ./fllee-backend/Dockerfile
    env_file:
      - ./fllee-backend/.env
    environment:
      DATABASE_URL: file:/app/data/fleebee.db
      PAYMENTS_SHEET_SERVICE_ACCOUNT_FILE: /run/keys/fleebee-dd4c3c167ffb.json
      DATA_SYNC_SCRIPT_PATH: /data-sync/src/run-once.js
      DATA_SYNC_ENV_FILE: /data-sync/.env
      BANK_EMAIL_STATE_FILE: /email-inbox/state.json
      BANK_EMAIL_INBOX_DIR: /email-inbox
    ports:
      - "4100:4100"
    volumes:
      - fleebee_backend_data:/app/data
      - ./apps-key:/run/keys:ro
      - ./data-sync:/data-sync:ro
      # statements fetched from Gmail (gmail-downloader): its state.json and the PDF folders; empty when unused
      - ${EMAIL_INBOX_HOST_DIR:-./.email-inbox}:/email-inbox:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  fleebee_backend_data:
